name: jui
description: A Flutter UI component library with four modules, general, data display, data entry, and feedback. Includes buttons, labels, text, headers, containers, and placeholder
version: 0.3.0
homepage: https://github.com/ThinkerJack/jui
repository: https://github.com/ThinkerJack/jui

environment:
  sdk: ">=2.17.5 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  universal_platform: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  lints: ^2.1.1

flutter:
  assets:
    - assets/
    - assets/images/

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows: